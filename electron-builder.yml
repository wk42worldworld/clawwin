appId: com.clawwin.app
productName: ClawWin
copyright: Copyright (c) 2024 ClawWin Team

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - src/renderer/**/*
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: scripts/
    to: scripts/
    filter:
      - "**/*"
  - from: image/
    to: image/
    filter:
      - "**/*"

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClawWin
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  license: LICENSE
  artifactName: "ClawWin-Setup-${version}.${ext}"

publish:
  provider: generic
  url: https://releases.openclaw.dev/desktop
